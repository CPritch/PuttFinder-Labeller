<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PuttFinder Labeller</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">PuttFinder Labeller <span class="phase">v1.0</span></div>
    <div class="load-row">
      <input id="videoPath" type="text" placeholder="Absolute path to .avi (e.g. /home/user/PuttFinder-Labeller/videos/clip.avi)" />
      <button id="loadBtn">Load Video</button>
      <label class="preset-wrap">
        Rig
        <select id="presetSelect"></select>
      </label>
    </div>
    <div class="save-row">
      <button id="undoBtn" title="Undo (Ctrl+Z)">Undo</button>
      <button id="redoBtn" title="Redo (Ctrl+Shift+Z)">Redo</button>
      <button id="saveBtn" title="Overwrite master JSON">Save</button>
      <button id="saveAsBtn" title="Save a named copy next to video">Save As&hellip;</button>
      <span id="saveStatus" class="muted"></span>
    </div>
  </header>

  <main>
    <section class="stage">
      <div id="viewport" class="viewport">
        <img id="frameImg" draggable="false" />
        <canvas id="overlay"></canvas>
        <div id="magnifier" class="magnifier hidden">
          <canvas id="magCanvas" width="180" height="180"></canvas>
          <div class="mag-label"><span id="magCoord">0, 0</span> · <span id="magZoom">8×</span></div>
        </div>
      </div>

      <div class="controls">
        <button id="stepBackBtn" title="Step back 1 frame (←)">&laquo;</button>
        <button id="playBtn" title="Play / Pause (Space)">Play</button>
        <button id="stepFwdBtn" title="Step forward 1 frame (→)">&raquo;</button>
        <input id="frameSlider" type="range" min="1" max="1" step="1" value="1" />
        <div class="frame-readout">
          Frame <input id="frameInput" type="number" min="1" value="1" />
          <span id="frameTotal">/ 0</span>
          <span class="muted" id="timeReadout">0.000 s</span>
        </div>
      </div>

      <div class="radius-row">
        <label>
          Default radius:
          <input id="radiusInput" type="number" min="1" step="0.5" value="8" /> px
        </label>
        <label>
          <input id="magToggle" type="checkbox" checked /> Magnifier
        </label>
        <label>
          Zoom
          <select id="magZoomSel">
            <option value="4">4×</option>
            <option value="6">6×</option>
            <option value="8" selected>8×</option>
            <option value="12">12×</option>
            <option value="16">16×</option>
          </select>
        </label>
        <span class="muted small">Click = place / select · drag = move · scroll = radius · Shift-scroll = fine</span>
      </div>
    </section>

    <aside class="sidebar">
      <div class="sidebar-head">
        <h2>Balls</h2>
        <button id="newBallBtn" title="New ball (N)">+ New</button>
      </div>
      <ul id="ballList"></ul>

      <hr />

      <h2>Current Frame</h2>
      <ul id="markerList"></ul>

      <hr />

      <h2>Segments (active ball)</h2>
      <ul id="segmentList"></ul>

      <hr />

      <h2>Video / Rig</h2>
      <div id="metaReadout" class="muted small">No video loaded.</div>
    </aside>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
