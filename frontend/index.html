<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PuttFinder Labeller</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">PuttFinder Labeller <span class="phase">POC</span></div>
    <div class="load-row">
      <input id="videoPath" type="text" placeholder="Absolute path to .avi (e.g. /home/user/PuttFinder-Labeller/videos/clip.avi)" />
      <button id="loadBtn">Load Video</button>
    </div>
    <div class="save-row">
      <button id="saveBtn" title="Overwrite master JSON">Save</button>
      <button id="saveAsBtn" title="Save a named copy next to video">Save As&hellip;</button>
      <span id="saveStatus" class="muted"></span>
    </div>
  </header>

  <main>
    <section class="stage">
      <div id="viewport" class="viewport">
        <img id="frameImg" draggable="false" />
        <canvas id="overlay"></canvas>
      </div>

      <div class="controls">
        <button id="stepBackBtn" title="Step back 1 frame (←)">&laquo;</button>
        <button id="playBtn" title="Play / Pause (Space)">Play</button>
        <button id="stepFwdBtn" title="Step forward 1 frame (→)">&raquo;</button>
        <input id="frameSlider" type="range" min="1" max="1" step="1" value="1" />
        <div class="frame-readout">
          Frame <input id="frameInput" type="number" min="1" value="1" />
          <span id="frameTotal">/ 0</span>
          <span class="muted" id="timeReadout">0.000 s</span>
        </div>
      </div>

      <div class="radius-row">
        <label>
          Radius (scroll on frame to adjust):
          <input id="radiusInput" type="number" min="1" step="0.5" value="8" />
          px
        </label>
        <span class="muted">Click to place a marker. Selected marker is adjusted by the scroll-wheel.</span>
      </div>
    </section>

    <aside class="sidebar">
      <h2>Current Frame Markers</h2>
      <ul id="markerList"></ul>
      <div class="muted small">
        Click sets a ball center. Scroll the wheel over the frame to resize the
        most recently placed or selected marker.
      </div>
      <hr />
      <h2>Video</h2>
      <div id="metaReadout" class="muted small">No video loaded.</div>
    </aside>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
