[project]
name = "puttfinder-labeller"
version = "0.2.0"
description = "Local web-based video labelling tool for high-speed IR ball tracking"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "pydantic>=2.6",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
]

[tool.uv]
package = false
